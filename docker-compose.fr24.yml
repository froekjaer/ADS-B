services:
  fr24:
    image: ghcr.io/sdr-enthusiasts/docker-flightradar24:latest
    container_name: fr24
    restart: unless-stopped
    depends_on:
      - ultrafeeder
    environment:
      - TZ=${FEEDER_TZ}
      - BEASTHOST=ultrafeeder
      - BEASTPORT=30005
      - FR24KEY=${FR24_SHARING_KEY:?FR24 key missing}
      - MLAT=no
    ports:
      - "8754:8754"
    tmpfs:
      - /var/log
