# Optional AIS-Catcher on a second RTL-SDR.
# Use: docker compose -f docker-compose.yml -f docker-compose.ais.yml up -d
# Requires ./ais/config.json copied and edited from config.json.example.
# Do not expose the AIS viewer outside a trusted LAN.
services:
  ais-catcher:
    image: ghcr.io/jvde-github/ais-catcher:latest
    container_name: ais-catcher
    restart: unless-stopped
    device_cgroup_rules:
      - "c 189:* rwm"
    volumes:
      - /dev/bus/usb:/dev/bus/usb
      - ./ais/config.json:/config/config.json:ro
    ports:
      - "8100:8100/tcp"
    command: ["-C", "/config/config.json"]
